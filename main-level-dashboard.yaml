            color_picker: true
          - type: light
            entity: light.living_room_entryway_bulb_3
            name: Entry light 3
            brightness: true
            color_temp: true
            color_picker: true
          - type: light
            entity: light.living_room_hallway_light_1
            name: Hallway light 1
            brightness: true
            color_temp: true
            color_picker: true
          - type: light
            entity: light.living_room_hallway_light_2
            name: Hallway light 2
            brightness: true
            color_temp: true
            color_picker: true
          - type: light
            entity: light.living_room_hallway_light_3
            name: Hallway light 3
            brightness: true
            color_temp: true
            color_picker: true
