title: Basement Theater
views:
  - title: Theater
    path: basement
    icon: mdi:movie-open
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Basement Theater
            heading_style: title
            icon: mdi:movie-open
          - type: button
            name: Main Level
            icon: mdi:home-floor-1
            tap_action:
              action: navigate
              navigation_path: /main-level/main-level
          - type: button
            name: Weather Station
            icon: mdi:weather-partly-cloudy
            tap_action:
              action: navigate
              navigation_path: /weather-station/weather
          - type: button
            name: Whole Home
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: /whole-home/overview
          - type: heading
            heading: Holiday Profiles
            heading_style: subtitle
            icon: mdi:lightbulb-group
          - type: button
            name: Halloween
            icon: mdi:halloween
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.basement_halloween
          - type: button
            name: Thanksgiving
            icon: mdi:leaf-maple
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.thanksgiving_home
          - type: button
            name: Christmas
            icon: mdi:pine-tree
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.christmas_home
          - type: heading
            heading: Room Presets
            heading_style: subtitle
            icon: mdi:movie-open
          - type: button
            name: Movie
            icon: mdi:movie-open-outline
