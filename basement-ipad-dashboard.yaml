                  - light.tv_area_light_1
                  - light.tv_area_light_2
                  - light.tv_area_light_3
                  - light.tv_area_light_4
                  - light.pendant_light_1
                  - light.pendant_light_2
                  - light.bar_light_1
                  - light.bar_light_2
                  - light.bar_light_3
                  - light.bar_light_4
                  - light.window_area_1
                  - light.window_area_2
                  - light.under_steps_light
                  - light.gym_light_1
                  - light.gym_light_2
                  - light.gym_light_3
              data:
                effect: Movie
                brightness_pct: 28
          - type: button
            name: Game time
            icon: mdi:football-helmet
