
# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  dashboards:
    at-a-glance:
      mode: yaml
      filename: at-a-glance-dashboard.yaml
      title: At a Glance
      icon: mdi:view-dashboard-outline
      show_in_sidebar: true
    weather-station:
      mode: yaml
      filename: weather-station-dashboard.yaml
      title: Weather Station
      icon: mdi:weather-partly-cloudy
      show_in_sidebar: true
    basement-control:
      mode: yaml
      filename: basement-ipad-dashboard.yaml
      title: Basement Control
      icon: mdi:home-floor-b
      show_in_sidebar: true
    main-level:
      mode: yaml
      filename: main-level-dashboard.yaml
      title: Main Level
      icon: mdi:home-floor-1
      show_in_sidebar: true
    whole-home:
      mode: yaml
      filename: whole-home-dashboard.yaml
      title: Whole Home
      icon: mdi:home
      show_in_sidebar: true
    security-cameras:
      mode: yaml
      filename: blink-cameras-dashboard.yaml
      title: Cameras
      icon: mdi:cctv
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml

# Keep the database lean: ESPN REST payloads are large JSON blobs that the
# recorder cannot store anyway; dashboards read live data in the browser.
recorder:
  exclude:
    entity_globs:
      - sensor.espn_*

shell_command:
  sync_backups_to_onedrive: >-
    /bin/sh -c 'mkdir -p /onedrive_backups && cp -f /backup/* /onedrive_backups/ 2>/dev/null || true; cp -f /config/backups/* /onedrive_backups/ 2>/dev/null || true; ls -1t /onedrive_backups/* 2>/dev/null | tail -n +31 | xargs -r rm -f'
