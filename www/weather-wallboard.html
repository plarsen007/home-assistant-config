<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Station</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f2e9;
      --muted: #b9c1c7;
      --line: rgba(255,255,255,.14);
      --panel: rgba(9, 19, 28, .72);
      --accent: #f4b860;
      --sky-a: #173b5f;
      --sky-b: #07121e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      background: radial-gradient(circle at 76% 8%, rgba(244,184,96,.28), transparent 29rem), linear-gradient(135deg, var(--sky-a), var(--sky-b) 68%);
    }
    body:before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .2; background: repeating-linear-gradient(115deg, transparent 0 11px, rgba(255,255,255,.03) 12px 13px); }
    main { position: relative; max-width: 1320px; min-height: 100vh; margin: auto; padding: 34px 44px 40px; display: grid; grid-template-rows: auto 1fr auto; gap: 28px; }
    header { display: flex; justify-content: space-between; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font: 700 14px/1.1 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 68px); line-height: .95; font-weight: 400; }
    .stamp { color: var(--muted); font: 700 15px/1.4 Arial, sans-serif; text-align: right; }
    .hero { display: grid; grid-template-columns: 1.25fr .75fr; gap: 28px; align-items: center; }
    .current { min-height: 330px; display: flex; flex-direction: column; justify-content: center; }
    .temperature { font: 400 clamp(120px, 20vw, 260px)/.78 Georgia, serif; letter-spacing: -8px; }
    .condition { margin-top: 28px; color: var(--accent); font-size: clamp(28px, 4vw, 54px); }
    .feels { margin-top: 10px; color: var(--muted); font: 20px/1.4 Arial, sans-serif; }
    .forecast { display: grid; gap: 10px; }
    .day { display: grid; grid-template-columns: 82px 52px 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); font-family: Arial, sans-serif; }
    .day-name { font-weight: 700; }
    .weather-mark { color: var(--accent); font-size: 30px; text-align: center; }
    .day-desc { color: var(--muted); font-size: 14px; }
    .day-temp { font-size: 20px; white-space: nowrap; }
    .details { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .metric { min-height: 94px; padding: 15px 17px; border-top: 2px solid var(--accent); background: var(--panel); }
    .metric-label { color: var(--muted); font: 12px/1.2 Arial, sans-serif; text-transform: uppercase; letter-spacing: 1px; }
    .metric-value { margin-top: 10px; font: 700 22px/1.1 Arial, sans-serif; }
    .error { color: #ffb4a8; font: 16px Arial, sans-serif; }
    @media (max-width: 850px) { main { padding: 24px; } .hero { grid-template-columns: 1fr; } .current { min-height: 250px; } .details { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 560px) { .stamp { display: none; } .details { grid-template-columns: repeat(2, 1fr); } .day { grid-template-columns: 62px 42px 1fr; } .day-temp { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Weather station / 55318</p><h1>Chaska, Minnesota</h1></div>
      <div class="stamp" id="updated">Loading local sky...</div>
    </header>
    <section class="hero">
      <div class="current">
        <div class="temperature" id="temperature">--</div>
        <div class="condition" id="condition">Reading the sky</div>
        <div class="feels" id="feels">Connecting to wttr.in...</div>
      </div>
      <div class="forecast" id="forecast"></div>
    </section>
    <section class="details" id="details"></section>
  </main>
  <script>
    const icon = text => /rain|drizzle|shower/i.test(text) ? '•••' : /snow|sleet/i.test(text) ? '***' : /thunder/i.test(text) ? '⚡' : /cloud|overcast/i.test(text) ? '☁' : '☼';
    const value = (object, path, fallback = '--') => path.reduce((item, key) => item && item[key], object) ?? fallback;
    const fmtTime = date => new Date(date).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
    async function load() {
      try {
        const data = await fetch('https://wttr.in/55318?format=j1').then(response => response.json());
        const now = data.current_condition[0];
        const area = data.nearest_area[0];
        const temp = now.temp_F;
        const desc = value(now, ['weatherDesc', 0, 'value'], 'Current conditions');
        document.querySelector('#temperature').textContent = `${temp}°`;
        document.querySelector('#condition').textContent = desc;
        document.querySelector('#feels').textContent = `Feels like ${now.FeelsLikeF}° · ${now.humidity}% humidity · ${now.windspeedMiles} mph ${now.winddir16Point}`;
        document.querySelector('#updated').textContent = `${area.areaName[0].value} · Updated ${fmtTime(Date.now())}`;
        document.body.style.setProperty('--accent', Number(temp) > 80 ? '#ff9d66' : Number(temp) < 40 ? '#89c7e8' : '#f4b860');
        document.querySelector('#forecast').innerHTML = data.weather.slice(0, 4).map((day, index) => {
          const label = index === 0 ? 'Today' : new Date(day.date).toLocaleDateString([], {weekday: 'short'});
          const description = value(day, ['hourly', 4, 'weatherDesc', 0, 'value'], 'Forecast');
          return `<div class="day"><span class="day-name">${label}</span><span class="weather-mark">${icon(description)}</span><span class="day-desc">${description}</span><span class="day-temp">${day.maxtempF}° / ${day.mintempF}°</span></div>`;
        }).join('');
        const astronomy = data.weather[0].astronomy[0];
        const metrics = [['Humidity', `${now.humidity}%`], ['Wind', `${now.windspeedMiles} mph ${now.winddir16Point}`], ['Visibility', `${now.visibility} mi`], ['UV index', now.uvIndex], ['Sunrise', astronomy.sunrise], ['Sunset', astronomy.sunset]];
        document.querySelector('#details').innerHTML = metrics.map(([label, metric]) => `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${metric}</div></div>`).join('');
      } catch (error) { document.querySelector('#feels').innerHTML = '<span class="error">Weather service unavailable. Retrying on refresh.</span>'; }
    }
    load(); setInterval(load, 900000);
  </script>
</body>
</html>
